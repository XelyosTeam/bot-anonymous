stages:
    - quality
    - build
    - deploy

variables:
    DOCKER_BUILDKIT: '1'
    IMAGE_SHA: '$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA'
    IMAGE_LATEST: '$CI_REGISTRY_IMAGE:latest'

workflow:
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#################
# QUALITY
#################

.node:
    stage: quality
    image: node:26-alpine
    cache:
        key:
            files: [app/package-lock.json]
        paths: [app/.npm/]
    before_script:
        - cd app
        - npm ci --cache .npm --prefer-offline --no-audit --no-fund

lint:
    extends: .node
    script:
        - npm run lint

test:
    extends: .node
    script:
        - npm test

audit:
    extends: .node
    script:
        - npm audit --omit=dev --audit-level=high

#################
# BUILD
#################

docker-build:
    stage: build
    image: docker:latest
    services:
        - docker:dind
    rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    before_script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    script:
        - docker pull "$IMAGE_LATEST" || true
        - docker build --cache-from "$IMAGE_LATEST" --build-arg BUILDKIT_INLINE_CACHE=1 -t "$IMAGE_SHA" .
        - docker push "$IMAGE_SHA"
        - |
            if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
                docker tag "$IMAGE_SHA" "$IMAGE_LATEST" && docker push "$IMAGE_LATEST"
            fi
        - |
            if [ -n "$CI_COMMIT_TAG" ]; then
                VERSION="${CI_COMMIT_TAG#v}"
                docker tag "$IMAGE_SHA" "$CI_REGISTRY_IMAGE:$VERSION" && docker push "$CI_REGISTRY_IMAGE:$VERSION"
            fi

#################
# DEPLOY (optional)
#################
# Only runs when the DEPLOY_HOST CI/CD variable is set (Settings > CI/CD > Variables):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_PORT (optional, defaults to 22)
#   DEPLOY_SSH_KEY (private key, masked and protected variable)

deploy:
    stage: deploy
    image: alpine:latest
    needs: [docker-build]
    environment: production
    rules:
        - if: $DEPLOY_HOST && ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
    before_script:
        - apk add --no-cache openssh-client
        - mkdir -p ~/.ssh && chmod 700 ~/.ssh
        - printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
        - ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    script:
        - SSH="ssh -i $HOME/.ssh/id_deploy -p ${DEPLOY_PORT:-22} $DEPLOY_USER@$DEPLOY_HOST"
        - $SSH "mkdir -p '$DEPLOY_PATH'"
        - scp -i ~/.ssh/id_deploy -P "${DEPLOY_PORT:-22}" docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
        - printf '%s' "$CI_JOB_TOKEN" | $SSH "docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY"
        - $SSH "cd '$DEPLOY_PATH' && sh -s -- '$IMAGE_SHA'" < scripts/remote-update.sh
        - $SSH "docker logout $CI_REGISTRY"
