name: CI

on:
    push:
        branches: [main, master]
        tags: ['v*']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Lint, tests & audit
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm
                  cache-dependency-path: app/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm test
            - run: npm audit --omit=dev --audit-level=high

    docker:
        name: Build & push image
        needs: quality
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.ref.outputs.image }}
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha
            - id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - id: ref
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: echo "image=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')@${DIGEST}" >> "$GITHUB_OUTPUT"

    # Optional SSH deployment: only runs when the DEPLOY_HOST variable is set
    # (Settings > Secrets and variables > Actions > Variables: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_PORT
    #  and Secrets: DEPLOY_SSH_KEY)
    deploy:
        name: Deploy
        needs: docker
        if: vars.DEPLOY_HOST != '' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read
            packages: read
        env:
            DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
            DEPLOY_USER: ${{ vars.DEPLOY_USER }}
            DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
            DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
            IMAGE: ${{ needs.docker.outputs.image }}
        steps:
            - uses: actions/checkout@v4
            - name: Configure SSH
              env:
                  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh && chmod 700 ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
                  ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
            - name: Deploy
              env:
                  REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REGISTRY_USER: ${{ github.actor }}
              run: |
                  SSH="ssh -i $HOME/.ssh/id_deploy -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST"
                  $SSH "mkdir -p '$DEPLOY_PATH'"
                  scp -i ~/.ssh/id_deploy -P "$DEPLOY_PORT" docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
                  printf '%s' "$REGISTRY_TOKEN" | $SSH "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
                  $SSH "cd '$DEPLOY_PATH' && sh -s -- '$IMAGE'" < scripts/remote-update.sh
                  $SSH "docker logout ghcr.io"
